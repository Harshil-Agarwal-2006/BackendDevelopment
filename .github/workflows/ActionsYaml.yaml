name: PBL - Test, Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - "Lab/PBL/**"
      - ".github/workflows/ActionsYaml.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Lab/PBL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated API tests
        run: python automationTesting.py

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERTOKEN }}" | docker login -u "${{ secrets.DOCKERUSERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERUSERNAME }}/student-api:v0.1 .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERUSERNAME }}/student-api:v0.1